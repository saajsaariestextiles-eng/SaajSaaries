<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#0f766e" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--teal:#0f766e;--teal-d:#0b5e57;--bg:#f5f5f5;--card:#fff;--line:#e2e8f0;--muted:#64748b;--ink:#0f172a}
  html,body{height:100%}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .side{width:230px;background:var(--teal);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.15)}
  .brand h1{font-size:16px;line-height:1.3}
  .brand p{font-size:11px;opacity:.8;margin-top:2px}
  .nav{padding:10px 8px;flex:1;overflow:auto}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#e6fffb;padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:4px}
  .nav button:hover{background:rgba(255,255,255,.12)}
  .nav button.active{background:#fff;color:var(--teal);font-weight:600}
  .nav .ic{width:18px;text-align:center}

  .topbar{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex-shrink:0}
  .topbar h2{font-size:17px}
  .top-actions{display:flex;gap:8px;align-items:center}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
  .btn:hover{background:var(--teal-d)}
  .btn.ghost{background:#e2e8f0;color:var(--ink)}
  .btn.ghost:hover{background:#cbd5e1}
  .btn.danger{background:#dc2626}

  .save-pill.warn{background:#fee2e2;color:#991b1b}
  .view{padding:20px;overflow:auto;flex:1}
  /* Cards */
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .k{font-size:12px;color:var(--muted)}
  .card .v{font-size:24px;font-weight:700;margin-top:4px}
  .card .v.sm{font-size:18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .panel h3{font-size:15px;margin-bottom:12px}
  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  tr:hover td{background:#f8fafc}
  td .actions{display:flex;gap:6px;justify-content:flex-end}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .tag.paid{background:#dcfce7;color:#166534}
  .tag.unpaid{background:#fee2e2;color:#991b1b}
  .tag.partial{background:#fef9c3;color:#854d0e}
  .tag.quot{background:#e0e7ff;color:#3730a3}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:1000}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:720px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal.wide{max-width:880px}

  .modal header h3{font-size:16px}

  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:60px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}

  .items .ir .amt{font-size:13px;padding-top:8px;font-weight:600;text-align:right}

  /* PIN */
  .pin-wrap{position:fixed;inset:0;background:var(--teal);display:flex;align-items:center;justify-content:center;z-index:2000}
  .pin-box{background:#fff;border-radius:16px;padding:30px 28px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .pin-box h2{color:var(--teal);margin-bottom:6px}
  .pin-box p{font-size:13px;color:var(--muted);margin-bottom:18px}
  .pin-box input{text-align:center;letter-spacing:8px;font-size:20px;margin-bottom:12px}
  .pin-err{color:#dc2626;font-size:12px;min-height:16px;margin-bottom:8px}
  /* Print document + on-screen preview */
  #print-area{display:none}
  .preview-doc{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
  @media print{
    body *{visibility:hidden !important}
    #print-area,#print-area *{visibility:visible !important}
    #print-area{display:block !important;position:absolute;left:0;top:0;width:100%}
    @page{margin:14mm}
  }
  .doc{font-family:Inter,Arial,sans-serif;color:#111;max-width:800px;margin:0 auto;padding:8px 4px}
  .doc .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--teal);padding-bottom:10px;margin-bottom:14px}
  .doc .dh .co{font-size:20px;font-weight:800;color:var(--teal)}
  .doc .dh .meta{text-align:right;font-size:12px;color:#333}
  .doc .pt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:14px}
  .doc .pt b{display:block;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .doc table{border-collapse:collapse;width:100%;margin:10px 0}
  .doc th,.doc td{border:1px solid #cbd5e1;padding:7px 9px;font-size:12px;text-align:left}

  .doc .rt{width:280px;margin-left:auto;font-size:13px;margin-top:8px}

  .doc .words{font-size:12px;font-style:italic;color:#334155;margin-top:6px;text-align:right}
  .doc .notes{font-size:12px;color:#475569;margin-top:14px}
  .doc .notes ul{margin:4px 0 0 18px;padding:0}

  .doc .bankbox{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:12px;color:#334155;background:#f8fafc;margin-top:14px}
  .doc .sig{display:flex;justify-content:space-between;margin-top:36px;font-size:12px;color:#475569}
  @media(max-width:720px){.side{width:64px}.brand p,.nav button span{display:none}.row,.row3{grid-template-columns:1fr}}
</style>

<body>
<div class="pin-wrap" id="pin-wrap">
  <div class="pin-box">

    <button class="btn" style="width:100%" id="pin-submit">Unlock</button>

</div>

<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand">
      <h1>Saaj Saaries</h1>

    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="ic">▦</span><span>Dashboard</span></button>

<script>
/* ---------------- Helpers ---------------- */
const DB_KEY = 'saaj_saaries_billing_v1';   // encrypted vault (AES-256) in localStorage
const AUTH_KEY = 'saaj_auth_session_v1';    // session-scoped decryption key (cleared when browser closes)
const DEFAULT_PIN = '9696';                 // entry PIN — change it in Settings
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '';
const statusTag = st => st==='paid'?'<span class="tag paid">Paid</span>': st==='partial'?'<span class="tag partial">Partial</span>':'<span class="tag unpaid">Unpaid</span>';
/* safe storage wrappers (fall back to in-memory if localStorage is blocked, e.g. sandboxed previews) */
const store = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } },
                set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} },
                remove:k=>{ try{ localStorage.removeItem(k); }catch(e){} } };
const sstore = { get:k=>{ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
                 set:(k,v)=>{ try{ sessionStorage.setItem(k,v); }catch(e){} },
                 remove:k=>{ try{ sessionStorage.removeItem(k); }catch(e){} } };

function defaults(){
  return {
    settings:{businessName:'Saaj Saaries Textiles', address:'Tardal, Ichalkaranji, Maharashtra', gstin:'', phone:'', pin:DEFAULT_PIN,
      billPrefix:'INV', billCounter:1, quotePrefix:'QUO', quoteCounter:1, challanPrefix:'CHL', challanCounter:1, gstPercent:5,
      accountName:'Saaj Saaries Textiles', bankName:'', accountNo:'', ifsc:'', upi:'',
      defaultTerms:'1. Goods once sold will not be taken back or exchanged.\n2. Interest @18% p.a. will be charged on delayed payments.\n3. All disputes subject to Ichalkaranji jurisdiction.\n4. E & O E.'},
    parties:[{id:'p1',name:'Mahatrudr',address:'',phone:'',gstin:''},
            {id:'p2',name:'Dilip Mangate',address:'',phone:'',gstin:''},
            {id:'p3',name:'DP Traders',address:'',phone:'',gstin:''}],
    products:[{id:'pr1',name:'Cotton Saree',hsn:'5208',unit:'pcs',rate:450},
              {id:'pr2',name:'Silk Saree',hsn:'5007',unit:'pcs',rate:1850},
              {id:'pr3',name:'Handloom Saree',hsn:'5208',unit:'pcs',rate:480},
              {id:'pr4',name:'Dress Material',hsn:'5209',unit:'set',rate:320}],
    bills:[], quotations:[], challans:[], payments:[]
  };
}

/* ---------------- Encryption — AES-256-GCM, key derived from the PIN (PBKDF2) ---------------- */
/* Nothing sensitive is ever written to disk or to the cloud in plaintext.
   The whole app state lives inside an encrypted "vault". A wrong PIN simply
   fails to decrypt it, so data stays unreadable. */
const enc = new TextEncoder(), dec = new TextDecoder();
const bufToB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64ToBuf = b64 => Uint8Array.from(atob(b64), c=>c.charCodeAt(0)).buffer;
async function deriveKey(pin, saltB64){
  const base = await crypto.subtle.importKey('raw', enc.encode('saaj-saaries::'+pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64ToBuf(saltB64), iterations:150000, hash:'SHA-256'},
                                 base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
async function encryptVault(obj, key, saltB64){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return {v:1, salt:saltB64, iv:bufToB64(iv.buffer), ct:bufToB64(ct)};
}
async function decryptVault(bundle, key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBuf(bundle.iv)}, key, b64ToBuf(bundle.ct));
  return JSON.parse(dec.decode(pt));   // throws if the key (PIN) is wrong
}

/* ---------------- Firebase Realtime Database (real-time cloud sync) ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDcqvjt2gnztCv-GKkA4-Xo0rAsfB_BeLs",
  authDomain: "saaj-saaries.firebaseapp.com",
  databaseURL: "https://saaj-saaries-default-rtdb.firebaseio.com",
  projectId: "saaj-saaries",
  storageBucket: "saaj-saaries.firebasestorage.app",
  messagingSenderId: "810345516090",
  appId: "1:810345516090:web:aa9abc7014861e94d63903",
  measurementId: "G-QZJE3PG27J"
};
const RTDB_PATH = 'billing/vault';   // one shared encrypted vault for all your devices
let fbApp=null, fbDB=null, fbMod=null, firebaseOk=false;
let vaultRemote=null;
async function loadFirebase(){
  try{
    const appMod = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js');
    fbMod       = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js');
    fbApp = appMod.initializeApp(firebaseConfig);
    fbDB  = fbMod.getDatabase(fbApp);
    try{ // anonymous sign-in satisfies the usual "auth != null" database rules
      const authMod = await import('https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js');
      await authMod.signInAnonymously(authMod.getAuth(fbApp));
    }catch(e){ console.warn('Anonymous sign-in unavailable — relying on open DB rules.', e); }
    firebaseOk = true;
    return true;
  }catch(e){
    console.warn('Firebase could not load — running in local-only encrypted mode.', e);
    firebaseOk = false;
    return false;
  }
}
async function fetchRemote(){
  try{
    const snap = await fbMod.get(fbMod.ref(fbDB, RTDB_PATH));
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.warn('Firebase read failed:', e); return null; }
}
async function pushRemote(bundle){
  await fbMod.set(fbMod.ref(fbDB, RTDB_PATH),
    {v:1, updatedAt:bundle.updatedAt, vault:{v:bundle.v, salt:bundle.salt, iv:bundle.iv, ct:bundle.ct}});
}
function subscribeRemote(cb){
  fbMod.onValue(fbMod.ref(fbDB, RTDB_PATH), snap=>{
    if(snap.exists()) cb(snap.val());
  }, err=>{ setSaveStatus('offline'); });
}

/* ---------------- State, encrypted save & sync ---------------- */
/* Repair records saved by the old buggy version (missing IDs) */
function ensureIds(arr){
  (arr||[]).forEach(x => { if(x && typeof x==='object' && !x.id) x.id = uid(); });
  return arr||[];
}
function mergeData(s){
  const d = defaults();
  if(!s || typeof s !== 'object') return d;
  d.settings = Object.assign({}, d.settings, s.settings || {});
  ['parties','products','bills','quotations','challans','payments'].forEach(k => { if(Array.isArray(s[k])) d[k] = ensureIds(s[k]); });
  return d;
}
let state = defaults();
let currentKey = null, currentSalt = null;   // decryption key — only ever held in memory while unlocked
let vaultLocal = null;                        // encrypted bundle from this browser
let _dirty=false, _saving=false, _again=false, _timer=null;
let _lastLocalAt = 0;                         // updatedAt of the newest encrypted bundle we hold
let _currentView = 'dashboard';

function save(){                              // encrypt + write locally + push to Firebase (debounced)
  _dirty = true;
  setSaveStatus('busy');
  if(_saving){ _again = true; return; }
  clearTimeout(_timer);
  _timer = setTimeout(flushSave, 450);
}
async function flushSave(){
  if(_saving){ _again = true; return; }
  if(!currentKey || !state){ _dirty=false; return; }
  _saving = true;
  try{
    const bundle = await encryptVault(state, currentKey, currentSalt);
    bundle.updatedAt = Date.now();
    _lastLocalAt = bundle.updatedAt;
    vaultLocal = bundle;
    store.set(DB_KEY, JSON.stringify(bundle));
    if(firebaseOk){
      try{ await pushRemote(bundle); setSaveStatus('ok', new Date(bundle.updatedAt)); }
      catch(e){ console.warn('Cloud push failed:', e); setSaveStatus('offline'); }
    } else setSaveStatus('offline');
    _dirty = false;
  }catch(e){
    console.error('Save failed', e);
    setSaveStatus('offline');
  }finally{
    _saving = false;
    if(_again){ _again = false; save(); }
  }
}
window.addEventListener('pagehide', ()=>{ if(_dirty && currentKey) flushSave(); });
function setSaveStatus(mode, when){
  const el = document.getElementById('save-status'); if(!el) return;
  const t = when ? ' · ' + when.toLocaleTimeString('en-IN') : '';
  if(mode==='busy'){ el.className='save-pill busy'; el.textContent='● Saving…'; el.title='Encrypting (AES-256) and saving locally + to Firebase'; }
  else if(mode==='ok'){ el.className='save-pill ok'; el.textContent='✓ Saved & synced'+t; el.title='Encrypted in this browser and synced to Firebase Realtime Database'; }
  else if(mode==='cloud'){ el.className='save-pill ok'; el.textContent='⇄ Cloud update received'+t; el.title='Newer encrypted data arrived from Firebase and was loaded'; }
  else if(mode==='offline'){ el.className='save-pill warn'; el.textContent='⚠ Cloud offline — saved locally'; el.title='Firebase unreachable. Data stays encrypted in this browser and syncs when the cloud is back.'; }
  else if(mode==='mismatch'){ el.className='save-pill warn'; el.textContent='⚠ Cloud PIN mismatch'; el.title='Cloud data could not be decrypted with the current PIN (it may have been changed on another device). Local data kept.'; }
}
const S = () => state.settings;
const partyName = id => { const p=state.parties.find(x=>x.id===id); return p?p.name:'—'; };

/* ---------------- Auth / PIN (9696) — encrypted unlock ----------------
   The data is decrypted ONLY when the correct PIN is entered. A wrong PIN
   makes decryption fail, so the PIN and all other information stay encrypted
   and unreadable. After 5 wrong attempts the PIN screen locks for a while. */
const MAX_ATTEMPTS = 5;
let pinAttempts  = Number(store.get('saaj_pin_attempts')||0);
let pinLockUntil = Number(store.get('saaj_pin_lock_until')||0);
let lockTimer = null;

function showPin(){
  document.getElementById('pin-wrap').style.display='flex';
  document.getElementById('app').style.display='none';
  const inp=document.getElementById('pin-input');
  inp.value=''; inp.disabled=false;
  document.getElementById('pin-submit').disabled=false;
  if(pinLockUntil > Date.now()) startLockTimer();
  else document.getElementById('pin-err').textContent='';
  inp.focus();
}
function showApp(){
  document.getElementById('pin-wrap').style.display='none';
  document.getElementById('app').style.display='flex';
  setView(_currentView);
}
async function saveSession(){
  sstore.set(AUTH_KEY, JSON.stringify({salt:currentSalt,
    key:bufToB64(await crypto.subtle.exportKey('raw', currentKey))}));
}
function failAttempt(){
  pinAttempts++;
  store.set('saaj_pin_attempts', String(pinAttempts));
  sstore.remove(AUTH_KEY);                       // never keep a session after a wrong PIN
  const errEl=document.getElementById('pin-err');
  const left=MAX_ATTEMPTS-pinAttempts;
  if(left<=0){
    const lockMs=Math.min(15*60*1000, 30*1000*Math.pow(2, Math.max(0, Math.floor((pinAttempts-1)/MAX_ATTEMPTS))));
    pinLockUntil=Date.now()+lockMs;
    store.set('saaj_pin_lock_until', String(pinLockUntil));
    pinAttempts=0; store.set('saaj_pin_attempts','0');
    errEl.textContent='Too many wrong attempts — locked for '+Math.round(lockMs/1000)+' seconds.';
    startLockTimer();
  } else {
    errEl.textContent='Wrong PIN. '+left+' attempt'+(left>1?'s':'')+' left.';
  }
  document.getElementById('pin-input').value='';
}
function startLockTimer(){
  const inp=document.getElementById('pin-input'), btn=document.getElementById('pin-submit'), errEl=document.getElementById('pin-err');
  const tick=()=>{
    const left=pinLockUntil-Date.now();
    if(left<=0){ clearInterval(lockTimer); inp.disabled=false; btn.disabled=false; errEl.textContent=''; return; }
    inp.disabled=true; btn.disabled=true;
    errEl.textContent='🔒 Locked — try again in '+Math.ceil(left/1000)+'s';
  };
  clearInterval(lockTimer); tick(); lockTimer=setInterval(tick,1000);
}
async function tryPin(){
  const v=document.getElementById('pin-input').value.trim();
  const errEl=document.getElementById('pin-err');
  if(!v){ errEl.textContent='Enter the PIN.'; return; }
  if(pinLockUntil > Date.now()){ startLockTimer(); return; }
  const local = vaultLocal;
  const remote = vaultRemote && vaultRemote.vault;
  const legacy = local && !local.salt ? local : null;   // plaintext data from the old version → migrate on first unlock
  const bundle = (local && local.salt ? local : null) || remote;
  try{
    if(legacy){
      if(v!==DEFAULT_PIN) throw new Error('wrong');
      state = mergeData(legacy); state.settings.pin = v;
      currentSalt = bufToB64(crypto.getRandomValues(new Uint8Array(16)).buffer);
      currentKey = await deriveKey(v, currentSalt);
      await flushSave();                               // encrypt old data with the new vault
    } else if(bundle){
      const key = await deriveKey(v, bundle.salt);
      const obj = await decryptVault(bundle, key);     // wrong PIN throws here → stays encrypted
      state = mergeData(obj);
      currentKey = key; currentSalt = bundle.salt;
    } else {
      if(v!==DEFAULT_PIN) throw new Error('wrong');    // first run: vault is created with 9696 only
      state = defaults(); state.settings.pin = v;
      currentSalt = bufToB64(crypto.getRandomValues(new Uint8Array(16)).buffer);
      currentKey = await deriveKey(v, currentSalt);
      await flushSave();
    }
    _lastLocalAt = Number(vaultLocal && vaultLocal.updatedAt)||0;
    pinAttempts=0; pinLockUntil=0;
    store.set('saaj_pin_attempts','0'); store.set('saaj_pin_lock_until','0');
    await saveSession();
    errEl.textContent='';
    showApp();
    checkRemoteAfterUnlock();
  }catch(e){
    failAttempt();   // wrong PIN → nothing is decrypted, everything stays encrypted
  }
}
async function checkRemoteAfterUnlock(){
  if(!firebaseOk || !vaultRemote) return;
  const rt = Number(vaultRemote.updatedAt)||0;
  if(rt <= _lastLocalAt) return;
  try{
    const obj = await decryptVault(vaultRemote.vault, currentKey);
    state = mergeData(obj);
    vaultLocal = {...vaultRemote.vault, updatedAt: rt};
    store.set(DB_KEY, JSON.stringify(vaultLocal));
    _lastLocalAt = rt;
    setSaveStatus('cloud', new Date(rt));
    showApp();
  }catch(e){ setSaveStatus('mismatch'); }   // cloud data uses a different PIN — local data kept
}
function handleRemote(remote){              // live realtime listener (other devices / tabs)
  if(!remote || !remote.vault) return;
  const rt = Number(remote.updatedAt)||0;
  vaultRemote = remote;
  if(!currentKey) return;                    // still locked — candidate used at unlock time
  if(rt <= _lastLocalAt) return;             // we already have the same or newer data
  (async()=>{
    try{
      const obj = await decryptVault(remote.vault, currentKey);
      state = mergeData(obj);
      vaultLocal = {...remote.vault, updatedAt: rt};
      store.set(DB_KEY, JSON.stringify(vaultLocal));
      _lastLocalAt = rt;
      setSaveStatus('cloud', new Date(rt));
      setView(_currentView);
    }catch(e){ setSaveStatus('mismatch'); }
  })();
}

/* ---------------- Totals ---------------- */
function docTotals(doc){
  let sub=0; (doc.items||[]).forEach(it=>{ sub += (Number(it.qty)||0)*(Number(it.rate)||0); });
  if(!isFinite(sub)) sub=0;
  const gst = sub*(Number(doc.gst)||0)/100;
  const disc = Number(doc.discount)||0;
  return {sub, gst, disc, grand: sub+gst-disc};
}
function partyOutstanding(pid){
  let billed=0, recd=0;
  state.bills.forEach(b=>{ if(b.partyId!==pid) return; const t=docTotals(b).grand; billed+=t; recd += (b.status==='paid')? t : (Number(b.paidAmount)||0); });
  return billed-recd;
}
/* Indian number → words */
function amountInWords(num){
  let n = Math.round(Number(num)||0);
  if(n<=0) return 'Zero Rupees Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x<20 ? a[x] : b[Math.floor(x/10)] + (x%10? ' '+a[x%10] : '');
  const three = x => (x>=100 ? a[Math.floor(x/100)]+' Hundred'+(x%100?' ':'') : '') + (x%100 ? two(x%100) : '');
  let s='';
  const cr=Math.floor(n/10000000); n%=10000000;
  const lk=Math.floor(n/100000);   n%=100000;
  const th=Math.floor(n/1000);     n%=1000;
  if(cr) s+=three(cr)+' Crore ';
  if(lk) s+=two(lk)+' Lakh ';
  if(th) s+=two(th)+' Thousand ';
  if(n)  s+=three(n);
  return s.trim()+' Rupees Only';
}

    else { data.gst=Number(document.getElementById('f-gst').value)||0; const discEl=document.getElementById('f-disc'); data.discount=discEl?Number(discEl.value)||0:0;
           if(kind==='quotation'){ data.validUntil=document.getElementById('f-valid').value; data.status='quotation'; }
           else { data.status=document.getElementById('f-status').value; data.paidAmount=Number(document.getElementById('f-paid').value)||0; } }
    if(id){ Object.assign(store[kind].find(x=>x.id===id), data); }
    else { store[kind].push({...data, id:d.id});
           if(kind==='bill') S().billCounter++; else if(kind==='quotation') S().quoteCounter++; else S().challanCounter++; }
    save(); closeModal(); renderDocs(kind);
  });
  document.getElementById('add-item').addEventListener('click', ()=>{ document.getElementById('item-rows').insertAdjacentHTML('beforeend', itemRow({},isChallan)); if(!isChallan) recalc(); });
  if(!isChallan) recalc();
  document.getElementById('items').addEventListener('input', e=>{ if(e.target.matches('input')) recalc(); });
  /* auto-fill rate when a product is picked / typed exactly */
  document.getElementById('items').addEventListener('change', e=>{
    const inp=e.target;
    if(inp.dataset && inp.dataset.k==='desc' && !isChallan){
      const pr=state.products.find(x=>x.name.toLowerCase()===inp.value.trim().toLowerCase());
      if(pr){ const rateEl=inp.closest('.ir').querySelector('[data-k=rate]'); if(rateEl){ rateEl.value=pr.rate; recalc(); } }
    }
  });
  const st=document.getElementById('f-status'); if(st) st.addEventListener('change', ()=>{ document.getElementById('paid-wrap').style.display = st.value==='unpaid'?'none':''; });
}
function itemRow(it,isChallan){
  const v=it||{};
  if(isChallan) return `<div class="ir"><input list="prod-list" placeholder="Item description" value="${esc(v.desc||'')}" data-k="desc"><input type="number" min="0" step="0.01" placeholder="Qty" value="${esc(v.qty||'')}" data-k="qty"><span></span><span></span><button class="del" data-del>×</button></div>`;
  return `<div class="ir"><input list="prod-list" placeholder="Item description" value="${esc(v.desc||'')}" data-k="desc"><input type="number" min="0" step="0.01" placeholder="Qty" value="${esc(v.qty||'')}" data-k="qty"><input type="number" min="0" step="0.01" placeholder="Rate" value="${esc(v.rate||'')}" data-k="rate"><span class="amt" data-amt>₹0.00</span><button class="del" data-del>×</button></div>`;
}
function collectItems(isChallan){
  const rows=document.querySelectorAll('#item-rows .ir'); const out=[];
  rows.forEach(r=>{
    const desc=r.querySelector('[data-k=desc]').value.trim();
    const o={desc, qty:Number(r.querySelector('[data-k=qty]').value)||0};
    if(!isChallan) o.rate=Number(r.querySelector('[data-k=rate]').value)||0;
    const pr=state.products.find(x=>x.name.toLowerCase()===desc.toLowerCase());
    if(pr && pr.hsn) o.hsn=pr.hsn;
    if(o.desc && o.qty>0) out.push(o);
  });
  return out;
}
function recalc(){
  let sub=0; document.querySelectorAll('#item-rows .ir').forEach(r=>{
    const qtyEl=r.querySelector('[data-k=qty]'); const rateEl=r.querySelector('[data-k=rate]');
    const q=Number(qtyEl?qtyEl.value:0)||0, rt=Number(rateEl?rateEl.value:0)||0; const amt=q*rt;
    const a=r.querySelector('[data-amt]'); if(a) a.textContent=money(amt); sub+=amt;
  });
  const gstEl=document.getElementById('f-gst');
  const gst=sub*(Number(gstEl?gstEl.value:0)||0)/100;
  const disc=Number(document.getElementById('f-disc')?.value||0)||0;
  const t=document.getElementById('totals'); if(!t) return;
  t.innerHTML=`
    <div><span>Subtotal</span><span>${money(sub)}</span></div>
    <div><span>GST</span><span>${money(gst)}</span></div>
    <div><span>Discount</span><span>- ${money(disc)}</span></div>
    <div class="grand"><span>Grand Total</span><span>${money(sub+gst-disc)}</span></div>`;
}

/* ---------------- Backup / Restore (encrypted) ---------------- */
document.getElementById('btn-backup').addEventListener('click', async ()=>{
  if(!currentKey){ alert('Unlock first.'); return; }
  const bundle = await encryptVault(state, currentKey, currentSalt);
  bundle.updatedAt = Date.now();
  const data=JSON.stringify({app:'saaj-saaries', note:'Encrypted AES-256 vault — can only be restored with the correct PIN', exportedAt:new Date().toISOString(), ...bundle}, null, 2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); const d=new Date();
  const pad=n=>(n<10?'0':'')+n;
  a.href=url; a.download=`saaj-saaries-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  a.click(); URL.revokeObjectURL(url);
});
document.getElementById('btn-restore').addEventListener('click', ()=>document.getElementById('restore-file').click());
document.getElementById('restore-file').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{ try{
    const data=JSON.parse(r.result);
    let bundle=null, plain=null;
    if(data && data.salt && data.ct) bundle=data;                       // encrypted backup
    else if(data && data.vault && data.vault.ct) bundle=data.vault;     // Firebase-style vault
    else if(data && data.settings) plain=data;                          // old plaintext backup
    else throw new Error('unknown format');
    if(bundle){
      const obj=await decryptVault(bundle, currentKey);
      if(!confirm('Restore will REPLACE all current data with this encrypted backup. Continue?')) return;
      state=mergeData(obj);
    }else{
      if(!confirm('This is an OLD PLAINTEXT backup. Restore will replace all data and re-encrypt it with the current PIN. Continue?')) return;
      state=mergeData(plain);
    }
    await flushSave();
    alert('Restore complete — data re-encrypted and synced.');
    setView('dashboard');
  }catch(err){ alert('Restore failed: not a valid backup, or the PIN does not match this vault.'); }
  e.target.value=''; };
  r.readAsText(f);
});

/* ---------------- Boot ---------------- */
async function init(){
  if(!window.crypto || !crypto.subtle){
    document.getElementById('pin-err').textContent='This browser does not support Web Crypto (needed for encryption). Please use a modern browser.';
    return;
  }
  try{ vaultLocal = JSON.parse(store.get(DB_KEY)); }catch(e){ vaultLocal = null; }
  await loadFirebase();
  if(firebaseOk){ vaultRemote = await fetchRemote(); subscribeRemote(handleRemote); }
  /* auto-unlock for this browser session only — the key lives in sessionStorage
     and disappears when the browser/tab is closed */
  try{
    const sess = JSON.parse(sstore.get(AUTH_KEY)||'null');
    const bundle = (vaultLocal && vaultLocal.salt) ? vaultLocal : (vaultRemote && vaultRemote.vault);
    if(sess && bundle && sess.salt===bundle.salt){
      const key = await crypto.subtle.importKey('raw', b64ToBuf(sess.key), 'AES-GCM', false, ['encrypt','decrypt']);
      const obj = await decryptVault(bundle, key);
      state = mergeData(obj);
      currentKey = key; currentSalt = bundle.salt;
      _lastLocalAt = Number(vaultLocal && vaultLocal.updatedAt)||0;
      showApp();
      checkRemoteAfterUnlock();
      return;
