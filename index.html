<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<title>Saaj Saaries Textiles — Billing & Delivery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#0f766e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --teal:#0f766e; --teal-d:#0b5e57; --teal-l:#e6fffb;
    --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --muted:#64748b; --ink:#0f172a;
    --red:#dc2626; --green:#16a34a; --amber:#d97706; --wa:#25D366;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html,body{height:100%}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  button{font-family:inherit;cursor:pointer;font-size:100%}
  .app{display:flex;min-height:100vh}

  /* ============ Sidebar (desktop only) ============ */
  .side{width:236px;background:var(--teal);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.15)}
  .brand h1{font-size:16px;line-height:1.3}
  .brand p{font-size:11px;opacity:.8;margin-top:2px}
  .nav{padding:10px 8px;flex:1;overflow:auto}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#e6fffb;padding:11px 12px;border-radius:10px;font-size:14px;margin-bottom:3px}
  .nav button:hover{background:rgba(255,255,255,.12)}
  .nav button.active{background:#fff;color:var(--teal);font-weight:700}
  .nav .ic{width:20px;text-align:center;font-size:15px}
  .side .foot{padding:12px 16px;font-size:11px;opacity:.75;border-top:1px solid rgba(255,255,255,.15)}

  /* ============ Main ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{min-height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;flex-shrink:0;position:sticky;top:0;z-index:60}
  .topbar h2{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-left{display:flex;align-items:center;gap:10px;min-width:0}
  .back-btn{display:none;border:none;background:#f1f5f9;width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--ink);flex-shrink:0}
  .top-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .view{padding:16px;overflow:auto;flex:1;padding-bottom:calc(24px + var(--safe-b))}

  /* ============ Buttons ============ */
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.2}
  .btn:active{transform:scale(.97)}
  .btn:hover{background:var(--teal-d)}
  .btn.ghost{background:#e2e8f0;color:var(--ink)}
  .btn.ghost:hover{background:#cbd5e1}
  .btn.danger{background:var(--red)}
  .btn.wa{background:var(--wa);color:#062e17}
  .btn.wa:hover{background:#1eb955}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
  .btn.block{width:100%}
  .btn:disabled{opacity:.55}
  .save-pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:#f1f5f9;color:#64748b;white-space:nowrap}
  .save-pill.ok{background:#dcfce7;color:#166534}
  .save-pill.busy{background:#fef9c3;color:#854d0e}
  .save-pill.warn{background:#fee2e2;color:#991b1b}

  /* ============ Home tiles (kiosk style) ============ */
  .hero{background:linear-gradient(135deg,var(--teal),#0d9488);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .hero .hh{font-size:13px;opacity:.85}
  .hero .hv{font-size:30px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
  .hero .hsub{display:flex;gap:14px;margin-top:10px;font-size:12px;opacity:.92;flex-wrap:wrap}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.05);min-height:112px}
  .tile:active{transform:scale(.97);background:#f8fafc}
  .tile .em{font-size:28px;line-height:1}
  .tile .tl{font-size:14px;font-weight:700}
  .tile .ts{font-size:11px;color:var(--muted)}
  .tile.big{grid-column:span 2;flex-direction:row;justify-content:flex-start;gap:14px;text-align:left;background:var(--teal);color:#fff;border-color:var(--teal);min-height:88px;padding:18px}
  .tile.big .ts{color:#c9f4ef}
  .tile.big .em{font-size:32px}

  /* ============ Stat chips ============ */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .stat .v{font-size:20px;font-weight:800;margin-top:3px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .panel h3{font-size:15px;margin-bottom:10px}
  .panel.flush{padding:0;overflow:hidden}
  .sec-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 2px 8px}

  /* ============ Search + toolbar ============ */
  .toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:160px;position:relative}
  .search input{width:100%;padding:12px 12px 12px 38px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff}
  .search::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.55}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:#475569}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}

  /* ============ List rows (mobile-first cards) ============ */
  .list{display:flex;flex-direction:column;gap:10px}
  .row-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
  .rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .rc-title{font-size:15px;font-weight:700;line-height:1.25}
  .rc-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .rc-amt{font-size:16px;font-weight:800;white-space:nowrap;text-align:right}
  .rc-actions{display:flex;gap:7px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:9px}
  .rc-actions .btn{flex:1;min-width:70px}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .tag.paid{background:#dcfce7;color:#166534}
  .tag.unpaid{background:#fee2e2;color:#991b1b}
  .tag.partial{background:#fef9c3;color:#854d0e}
  .tag.quot{background:#e0e7ff;color:#3730a3}
  .tag.due{background:#fee2e2;color:#991b1b}
  .empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:14px}
  .empty .em{font-size:34px;display:block;margin-bottom:8px;opacity:.6}

  /* tables (used inside ledger / print previews) */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* ============ Modal / bottom sheet ============ */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:1000}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:720px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:92vh}
  .modal.wide{max-width:900px}
  .modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
  .modal header h3{font-size:16px}
  .modal .body{padding:16px 18px;overflow:auto;flex:1}
  .modal footer{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;background:#fff;border-radius:0 0 16px 16px;flex-wrap:wrap}
  .modal footer .btn{flex:1;min-width:120px}
  .x{border:none;background:#f1f5f9;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;width:34px;height:34px;border-radius:10px}

  /* ============ Forms ============ */
  label{display:block;font-size:12.5px;font-weight:700;color:#334155;margin:14px 0 6px}
  input,select,textarea{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #99f6e4;border-color:var(--teal)}
  textarea{resize:vertical;min-height:62px;font-size:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f1f5f9;padding:5px;border-radius:12px}
  .seg button{border:none;background:none;padding:10px 6px;border-radius:9px;font-size:13px;font-weight:700;color:#475569}
  .seg button.on{background:#fff;color:var(--teal);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* item rows */
  .items{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .ir{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfdfd;position:relative}
  .ir .ir-desc{margin-bottom:8px}
  .ir .ir-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .ir .mini{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;display:block}
  .ir input{padding:10px;font-size:15px}
  .ir .amt{font-weight:800;font-size:15px;white-space:nowrap;padding-bottom:10px;text-align:right;min-width:88px}
  .ir .del{border:none;background:#fee2e2;color:#b91c1c;border-radius:10px;height:42px;width:42px;font-size:19px;flex-shrink:0}
  .totals{margin-top:14px;margin-left:auto;max-width:320px;font-size:14px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}
  .totals div{display:flex;justify-content:space-between;padding:4px 0}
  .totals .grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:800;font-size:17px}

  /* ============ PIN ============ */
  .pin-wrap{position:fixed;inset:0;background:linear-gradient(160deg,var(--teal),#0b5e57);display:flex;align-items:center;justify-content:center;z-index:2000;padding:18px}
  .pin-box{background:#fff;border-radius:20px;padding:28px 24px calc(24px + var(--safe-b));width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .pin-box h2{color:var(--teal);margin-bottom:4px;font-size:20px}
  .pin-box p{font-size:13px;color:var(--muted);margin-bottom:16px}
  .pin-box input{text-align:center;letter-spacing:10px;font-size:22px;margin-bottom:10px;padding:14px}
  .pin-err{color:var(--red);font-size:12px;min-height:16px;margin-bottom:8px}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .keypad button{border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:14px 0;font-size:19px;font-weight:700;color:var(--ink)}
  .keypad button:active{background:#e2e8f0}

  /* ============ Bottom nav (mobile) ============ */
  .bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:80;padding-bottom:var(--safe-b);box-shadow:0 -2px 14px rgba(15,23,42,.07)}
  .bottomnav .bn{display:grid;grid-template-columns:repeat(5,1fr)}
  .bottomnav button{border:none;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700}
  .bottomnav button .bi{font-size:19px;line-height:1}
  .bottomnav button.active{color:var(--teal)}
  .fab{display:none;position:fixed;right:16px;bottom:calc(74px + var(--safe-b));background:var(--teal);color:#fff;border:none;border-radius:999px;padding:15px 20px;font-size:15px;font-weight:800;box-shadow:0 8px 22px rgba(15,118,110,.45);z-index:70;gap:8px;align-items:center}

  /* ============ Print doc ============ */
  #print-area{display:none}
  .preview-doc{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;overflow-x:auto}
  @media print{
    body *{visibility:hidden !important}
    #print-area,#print-area *{visibility:visible !important}
    #print-area{display:block !important;position:absolute;left:0;top:0;width:100%}
    @page{margin:12mm}
  }
  .doc{font-family:Inter,Arial,sans-serif;color:#111;width:100%;max-width:780px;margin:0 auto;padding:6px 4px;background:#fff}
  .doc .dh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--teal);padding-bottom:10px;margin-bottom:12px;gap:10px}
  .doc .dh .co{font-size:19px;font-weight:800;color:var(--teal)}
  .doc .dh .meta{text-align:right;font-size:11.5px;color:#333;white-space:nowrap}
  .doc .pt{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:12px;gap:14px}
  .doc .pt b{display:block;color:#475569;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
  .doc table{border-collapse:collapse;width:100%;margin:10px 0}
  .doc th,.doc td{border:1px solid #cbd5e1;padding:6px 8px;font-size:11.5px;text-align:left}
  .doc th{background:#f0fdfa}
  .doc .rt{width:290px;margin-left:auto;font-size:12.5px;margin-top:8px}
  .doc .rt div{display:flex;justify-content:space-between;padding:3px 0}
  .doc .rt .g{border-top:2px solid #111;margin-top:5px;padding-top:5px;font-weight:800;font-size:14.5px}
  .doc .words{font-size:11.5px;font-style:italic;color:#334155;margin-top:6px;text-align:right}
  .doc .notes{font-size:11.5px;color:#475569;margin-top:12px}
  .doc .notes ul{margin:4px 0 0 18px;padding:0}
  .doc .notes li{margin:1px 0}
  .doc .bankbox{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font-size:11.5px;color:#334155;background:#f8fafc;margin-top:12px}
  .doc .sig{display:flex;justify-content:space-between;margin-top:34px;font-size:11.5px;color:#475569}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));background:#0f172a;color:#fff;padding:12px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:.96}

  /* ============ Responsive ============ */
  @media(max-width:820px){
    .side{display:none}
    .app{display:block}
    .main{min-height:100vh}
    .view{padding:14px 12px calc(150px + var(--safe-b))}
    .bottomnav{display:block}
    .fab{display:flex}
    .topbar{padding:8px 12px}
    .top-actions .desk{display:none}
    .row{grid-template-columns:1fr}
    .tile.big{grid-column:span 2}
    .tiles{grid-template-columns:1fr 1fr;gap:10px}
    .overlay{padding:0;align-items:flex-end}
    .modal{max-width:100%;border-radius:18px 18px 0 0;max-height:94vh;margin:0}
    .modal footer{border-radius:0}
    .totals{max-width:100%}
    .doc{font-size:12px}
  }
  @media(min-width:821px){ .back-btn{display:none !important} }
</style>
</head>
<body>

<!-- ============ PIN ============ -->
<div class="pin-wrap" id="pin-wrap">
  <div class="pin-box">
    <h2>Saaj Saaries Textiles</h2>
    <p>Enter your PIN to open</p>
    <input id="pin-input" type="password" inputmode="none" maxlength="12" placeholder="••••" autocomplete="off" autocapitalize="none" spellcheck="false" readonly />
    <div class="pin-err" id="pin-err"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="clear">✕</button><button data-k="0">0</button><button data-k="back">⌫</button>
    </div>
    <button class="btn block" id="pin-submit">Unlock</button>
  </div>
</div>

<!-- ============ App ============ -->
<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand"><h1>Saaj Saaries</h1><p>Tardal, Ichalkaranji</p></div>
    <nav class="nav" id="nav">
      <button data-view="home" class="active"><span class="ic">🏠</span><span>Home</span></button>
      <button data-view="bills"><span class="ic">🧾</span><span>Bills / Invoices</span></button>
      <button data-view="ledger"><span class="ic">📒</span><span>Party Ledger</span></button>
      <button data-view="dues"><span class="ic">⏰</span><span>Due Bills</span></button>
      <button data-view="parties"><span class="ic">👥</span><span>Parties</span></button>
      <button data-view="products"><span class="ic">🧵</span><span>Products</span></button>
      <button data-view="quotations"><span class="ic">✍️</span><span>Quotations</span></button>
      <button data-view="challans"><span class="ic">🚚</span><span>Delivery Challans</span></button>
      <button data-view="payments"><span class="ic">💰</span><span>Payments</span></button>
      <button data-view="settings"><span class="ic">⚙️</span><span>Settings</span></button>
    </nav>
    <div class="foot">🔒 AES‑256 encrypted · live sync</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="tb-left">
        <button class="back-btn" id="btn-back">‹</button>
        <h2 id="view-title">Home</h2>
      </div>
      <div class="top-actions">
        <span class="save-pill" id="save-status">● Starting…</span>
        <button class="btn ghost sm desk" id="btn-backup">⬇ Backup</button>
        <button class="btn ghost sm desk" id="btn-restore">⬆ Restore</button>
        <button class="btn ghost sm desk" id="btn-logout">🔒 Lock</button>
      </div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<!-- ============ Bottom nav + FAB ============ -->
<nav class="bottomnav" id="bottomnav">
  <div class="bn">
    <button data-view="home" class="active"><span class="bi">🏠</span>Home</button>
    <button data-view="bills"><span class="bi">🧾</span>Bills</button>
    <button data-view="ledger"><span class="bi">📒</span>Ledger</button>
    <button data-view="parties"><span class="bi">👥</span>Parties</button>
    <button data-action="more-menu"><span class="bi">☰</span>More</button>
  </div>
</nav>
<button class="fab" id="fab" data-action="add-bill">＋ New Bill</button>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="print-area"></div>
<div class="toast" id="toast"></div>
<input type="file" id="restore-file" accept="application/json" style="display:none" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script>
/* ================= Helpers ================= */
const DB_KEY = 'saaj_saaries_billing_v1';
const AUTH_KEY = 'saaj_auth_session_v1';

/* ================= Encryption (unchanged) ================= */
const enc = new TextEncoder(), dec = new TextDecoder();
const bufToB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64ToBuf = b64 => Uint8Array.from(atob(b64), c=>c.charCodeAt(0)).buffer;
async function deriveKey(pin, saltB64){
  const base = await crypto.subtle.importKey('raw', enc.encode('saaj-saaries::'+pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64ToBuf(saltB64), iterations:150000, hash:'SHA-256'},
                                 base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
async function encryptVault(obj, key, saltB64){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return {v:1, salt:saltB64, iv:bufToB64(iv.buffer), ct:bufToB64(ct)};
}
async function decryptVault(bundle, key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBuf(bundle.iv)}, key, b64ToBuf(bundle.ct));
  return JSON.parse(dec.decode(pt));
}

function ensureIds(arr){ (arr||[]).forEach(x=>{ if(x&&typeof x==='object'&&!x.id) x.id=uid(); }); return arr||[]; }
function mergeData(s){
  const d=defaults();
  if(!s||typeof s!=='object') return d;
  d.settings=Object.assign({},d.settings,s.settings||{});
  ['parties','products','bills','quotations','challans','payments'].forEach(k=>{ if(Array.isArray(s[k])) d[k]=ensureIds(s[k]); });
  return d;
}
let state = defaults();
let currentKey=null, currentSalt=null, vaultLocal=null;
let _dirty=false,_saving=false,_again=false,_timer=null,_lastLocalAt=0,_currentView='home';

function save(){ _dirty=true; setSaveStatus('busy'); if(_saving){_again=true;return;} clearTimeout(_timer); _timer=setTimeout(flushSave,450); }
async function flushSave(){
  if(_saving){_again=true;return;}
  if(!currentKey||!state){_dirty=false;return;}
  _saving=true;
  try{
    const b=await encryptVault(state,currentKey,currentSalt);
    b.updatedAt=Date.now(); _lastLocalAt=b.updatedAt; vaultLocal=b;
    store.set(DB_KEY,JSON.stringify(b));
    if(firebaseOk){ try{ await pushRemote(b); setSaveStatus('ok',new Date(b.updatedAt)); }catch(e){ setSaveStatus('offline'); } }
    else setSaveStatus('offline');
    _dirty=false;
  }catch(e){ setSaveStatus('offline'); }
  finally{ _saving=false; if(_again){_again=false;save();} }
}
window.addEventListener('pagehide',()=>{ if(_dirty&&currentKey) flushSave(); });
function setSaveStatus(mode,when){
  const el=document.getElementById('save-status'); if(!el) return;
  const t=when?' · '+when.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'';
  if(mode==='busy'){el.className='save-pill busy';el.textContent='● Saving…';}
  else if(mode==='ok'){el.className='save-pill ok';el.textContent='✓ Saved'+t;}
  else if(mode==='cloud'){el.className='save-pill ok';el.textContent='⇄ Updated'+t;}
  else if(mode==='offline'){el.className='save-pill warn';el.textContent='⚠ Offline';}
  else if(mode==='mismatch'){el.className='save-pill warn';el.textContent='⚠ PIN mismatch';}
}

async function saveSession(){
  try{ const raw=await crypto.subtle.exportKey('raw',currentKey);
       sstore.set(AUTH_KEY, JSON.stringify({salt:currentSalt,key:bufToB64(raw)})); }catch(e){}
}
function failAttempt(){
  pinAttempts++; store.set('saaj_pin_attempts',pinAttempts);
  const left=MAX_ATTEMPTS-pinAttempts; const err=document.getElementById('pin-err');
  if(left<=0){ pinLockUntil=Date.now()+60000; store.set('saaj_pin_lock_until',pinLockUntil);
    pinAttempts=0; store.set('saaj_pin_attempts',0); startLockTimer(); }
  else err.textContent='Wrong PIN — '+left+' attempt'+(left>1?'s':'')+' left';
  document.getElementById('pin-input').value='';
}
function startLockTimer(){
  const err=document.getElementById('pin-err'), inp=document.getElementById('pin-input'), btn=document.getElementById('pin-submit');
  inp.disabled=true; btn.disabled=true;
  clearInterval(lockTimer);
  lockTimer=setInterval(()=>{ const left=Math.ceil((pinLockUntil-Date.now())/1000);
    if(left<=0){ clearInterval(lockTimer); err.textContent=''; inp.disabled=false; btn.disabled=false; store.remove('saaj_pin_lock_until'); pinLockUntil=0; }
    else err.textContent='Too many wrong tries — wait '+left+'s'; },300);
}
async function tryPin(){
  const pin=document.getElementById('pin-input').value.trim();
  const err=document.getElementById('pin-err');
  if(pinLockUntil>Date.now()) return;
  if(!pin){ err.textContent='Enter the PIN'; return; }
  err.textContent='Checking…';
  const localB=(vaultLocal&&vaultLocal.salt)?vaultLocal:null;
  const remoteB=(vaultRemote&&vaultRemote.vault&&vaultRemote.vault.salt)?vaultRemote.vault:null;
  const pick=(localB&&remoteB)?((Number(vaultRemote.updatedAt)||0)>(Number(vaultLocal.updatedAt)||0)?remoteB:localB):(localB||remoteB);
  if(pick){
    try{
      const key=await deriveKey(pin,pick.salt);
      const obj=await decryptVault(pick,key);
      state=mergeData(obj); currentKey=key; currentSalt=pick.salt;
      _lastLocalAt=Math.max(Number(vaultLocal&&vaultLocal.updatedAt)||0,Number(vaultRemote&&vaultRemote.updatedAt)||0);
      pinAttempts=0; store.set('saaj_pin_attempts',0);
      await saveSession();
      if(pick===remoteB){ vaultLocal=Object.assign({},pick,{updatedAt:vaultRemote.updatedAt}); store.set(DB_KEY,JSON.stringify(vaultLocal)); }
      err.textContent=''; showApp(); if(firebaseOk) checkRemoteAfterUnlock(); return;
    }catch(e){ failAttempt(); return; }
  }
  /* first run */
  if(pin!==DEFAULT_PIN){ failAttempt(); return; }
  currentSalt=bufToB64(crypto.getRandomValues(new Uint8Array(16)).buffer);
  currentKey=await deriveKey(pin,currentSalt);
  state=defaults(); state.settings.pin=pin;
  await flushSave(); await saveSession();
  err.textContent=''; showApp();
}
async function checkRemoteAfterUnlock(){
  try{ const r=await fetchRemote(); if(!r||!r.vault) return;
    if((Number(r.updatedAt)||0)>_lastLocalAt) handleRemote(r); }catch(e){}
}
function handleRemote(remote){
  if(!currentKey||!remote||!remote.vault) return;
  const at=Number(remote.updatedAt)||0;
  if(at<=_lastLocalAt) return;
  decryptVault(remote.vault,currentKey).then(obj=>{
    state=mergeData(obj); _lastLocalAt=at;
    vaultLocal=Object.assign({},remote.vault,{updatedAt:at});
    store.set(DB_KEY,JSON.stringify(vaultLocal));
    setSaveStatus('cloud',new Date(at));
    if(!document.getElementById('overlay').classList.contains('show')) setView(_currentView);
  }).catch(()=>setSaveStatus('mismatch'));
}

/* ================= Money math ================= */
function docTotals(doc){
  let sub=0; (doc.items||[]).forEach(it=>{ sub+=(Number(it.qty)||0)*(Number(it.rate)||0); });
  if(!isFinite(sub)) sub=0;
  const gst=sub*(Number(doc.gst)||0)/100, disc=Number(doc.discount)||0;
  return {sub,gst,disc,grand:sub+gst-disc};
}
/* bill-level received = paidAmount (or full when marked paid) */
function billReceived(b){ const t=docTotals(b).grand; return b.status==='paid'?t:(Number(b.paidAmount)||0); }
function billDue(b){ return Math.max(0, docTotals(b).grand - billReceived(b)); }
/* party ledger figures: bills + separately recorded payments */
function partyStats(pid){
  let billed=0, onBill=0, extra=0;
  state.bills.forEach(b=>{ if(b.partyId!==pid) return; billed+=docTotals(b).grand; onBill+=billReceived(b); });
  state.payments.forEach(p=>{ if(p.partyId===pid) extra+=Number(p.amount)||0; });
  return {billed, received:onBill+extra, onBill, extra, outstanding: billed-onBill-extra};
}
function partyOutstanding(pid){ return partyStats(pid).outstanding; }
function amountInWords(num){
  let n=Math.round(Number(num)||0);
  if(n<=0) return 'Zero Rupees Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  let s=''; const cr=Math.floor(n/10000000); n%=10000000;
  const lk=Math.floor(n/100000); n%=100000; const th=Math.floor(n/1000); n%=1000;
  if(cr)s+=three(cr)+' Crore '; if(lk)s+=two(lk)+' Lakh '; if(th)s+=two(th)+' Thousand '; if(n)s+=three(n);
  return s.trim()+' Rupees Only';
}

/* build chronological running-balance ledger entries */
function ledgerEntries(pid){
  const e=[];
  state.bills.filter(b=>b.partyId===pid).forEach(b=>{
    const t=docTotals(b).grand;
    e.push({date:b.date,type:'bill',ref:b.number,desc:'Bill / Tax Invoice',debit:t,credit:0,id:b.id,status:b.status});
    const onBill=billReceived(b);
    if(onBill>0.005) e.push({date:b.date,type:'billpay',ref:b.number,desc:'Received against '+b.number,debit:0,credit:onBill});
  });
  state.payments.filter(p=>p.partyId===pid).forEach(p=>{
    e.push({date:p.date,type:'pay',ref:p.note||'',desc:'Payment received ('+(p.mode||'—')+')'+(p.note?' · '+p.note:''),debit:0,credit:Number(p.amount)||0,id:p.id});
  });
  e.sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a.debit?-1:1));
  let bal=0; e.forEach(x=>{ bal+=x.debit-x.credit; x.balance=bal; });
  return e;
}

function collectItems(isChallan){
  const out=[];
  document.querySelectorAll('#item-rows .ir').forEach(r=>{
    const desc=r.querySelector('[data-k=desc]').value.trim();
    const o={desc,qty:Number(r.querySelector('[data-k=qty]').value)||0};
    if(!isChallan){ const rt=r.querySelector('[data-k=rate]'); o.rate=rt?Number(rt.value)||0:0; }
    const pr=state.products.find(x=>x.name.toLowerCase()===desc.toLowerCase());
    if(pr&&pr.hsn) o.hsn=pr.hsn;
    if(o.desc&&o.qty>0) out.push(o);
  });
  return out;
}
function currentSubtotalTotals(){
  let sub=0;
  document.querySelectorAll('#item-rows .ir').forEach(r=>{
    const q=Number(r.querySelector('[data-k=qty]')?.value||0)||0;
    const rt=Number(r.querySelector('[data-k=rate]')?.value||0)||0;
    sub+=q*rt;
  });
  const gst=sub*(Number(document.getElementById('f-gst')?.value||0)||0)/100;
  const disc=Number(document.getElementById('f-disc')?.value||0)||0;
  return {sub,gst,disc,grand:sub+gst-disc};
}
function recalc(){
  let sub=0;
  document.querySelectorAll('#item-rows .ir').forEach(r=>{
    const q=Number(r.querySelector('[data-k=qty]')?.value||0)||0;
    const rt=Number(r.querySelector('[data-k=rate]')?.value||0)||0;
    const a=r.querySelector('[data-amt]'); if(a) a.textContent=money(q*rt);
    sub+=q*rt;
  });
  const t=document.getElementById('totals'); if(!t) return;
  const gst=sub*(Number(document.getElementById('f-gst')?.value||0)||0)/100;
  const disc=Number(document.getElementById('f-disc')?.value||0)||0;
  t.innerHTML=`<div><span>Subtotal</span><span>${money(sub)}</span></div>
    <div><span>GST</span><span>${money(gst)}</span></div>
    ${disc?`<div><span>Discount</span><span>- ${money(disc)}</span></div>`:''}
    <div class="grand"><span>Total</span><span>${money(sub+gst-disc)}</span></div>`;
}

/* ================= PDF ENGINE ================= */
function pdfFileName(kind,d){
  const t={bill:'Invoice',quotation:'Quotation',challan:'Challan'}[kind]||'Document';
  return (t+'-'+(d.number||'')+'-'+partyName(d.partyId)).replace(/[^\w\-]+/g,'_')+'.pdf';
}
async function htmlToPdfBlob(html){
  if(!window.jspdf||!window.html2canvas) throw new Error('PDF library not loaded');
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;width:800px;background:#fff;padding:20px;z-index:-1';
  holder.innerHTML=html;
  document.body.appendChild(holder);
  try{
    const canvas=await html2canvas(holder,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const iw=pw-16, ih=canvas.height*iw/canvas.width;
    const img=canvas.toDataURL('image/jpeg',0.92);
    if(ih<=ph-16){ pdf.addImage(img,'JPEG',8,8,iw,ih); }
    else{
      let left=ih, pos=8;
      pdf.addImage(img,'JPEG',8,pos,iw,ih); left-=(ph-16);
      while(left>0){ pos=left-ih+8; pdf.addPage(); pdf.addImage(img,'JPEG',8,pos,iw,ih); left-=(ph-16); }
    }
    return pdf.output('blob');
  } finally{ holder.remove(); }
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function saveDocPdf(kind,id){
  const d=DOC_STORE()[kind].find(x=>x.id===id); if(!d) return;
  toast('Making PDF…');
  try{ const blob=await htmlToPdfBlob(buildDocHtml(kind,id)); downloadBlob(blob,pdfFileName(kind,d)); toast('PDF saved'); }
  catch(e){ toast('PDF failed — use Print instead'); }
}
async function saveLedgerPdf(pid){
  const p=partyById(pid);
  toast('Making PDF…');
  try{ const blob=await htmlToPdfBlob(buildLedgerHtml(pid));
       downloadBlob(blob,('Statement-'+(p.name||'')).replace(/[^\w\-]+/g,'_')+'.pdf'); toast('PDF saved'); }
  catch(e){ toast('PDF failed — use Print instead'); }
}

function waNumber(phone){
  let n=String(phone||'').replace(/\D/g,'');
  if(!n) return '';
  if(n.length===10) n='91'+n;
  if(n.length===11&&n.startsWith('0')) n='91'+n.slice(1);
  return n;
}
function waText(kind,d){
  const s=S(), t=docTotals(d).grand, p=partyById(d.partyId);

/* Share the PDF itself where the device supports it, else send text + download the PDF */
async function shareOnWhatsApp({html,fileName,text,phone}){
  let blob=null;
  if(html){ try{ toast('Preparing PDF…'); blob=await htmlToPdfBlob(html); }catch(e){ blob=null; } }
  if(blob){
    try{
      const file=new File([blob],fileName,{type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file],text});
        return;
      }
    }catch(e){ if(e && e.name==='AbortError') return; }
    downloadBlob(blob,fileName);
    toast('PDF saved — attach it in WhatsApp');
  }
  openWa(phone,text);
}

    text:waLedgerText(pid), phone:p.phone});
}

/* ================= BACKUP / RESTORE ================= */
async function doBackup(){
  if(!currentKey){ toast('Unlock first'); return; }
  const b=await encryptVault(state,currentKey,currentSalt); b.updatedAt=Date.now();
  const data=JSON.stringify({app:'saaj-saaries',note:'Encrypted AES-256 vault',exportedAt:new Date().toISOString(),...b},null,2);
  const d=new Date(), pad=n=>(n<10?'0':'')+n;
  downloadBlob(new Blob([data],{type:'application/json'}),`saaj-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`);
  toast('Backup downloaded');
}
document.getElementById('btn-backup').addEventListener('click',doBackup);
document.getElementById('btn-restore').addEventListener('click',()=>document.getElementById('restore-file').click());
document.getElementById('restore-file').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{ try{
    const data=JSON.parse(r.result);
    let bundle=null,plain=null;
    if(data&&data.salt&&data.ct) bundle=data;
    else if(data&&data.vault&&data.vault.ct) bundle=data.vault;
    else if(data&&data.settings) plain=data;
    else throw new Error('unknown');
    if(bundle){ const obj=await decryptVault(bundle,currentKey);
      if(!confirm('Restore will REPLACE all current data. Continue?')) return;
      state=mergeData(obj);
    }else{ if(!confirm('Old plaintext backup — replace all data and re-encrypt?')) return; state=mergeData(plain); }
    await flushSave(); toast('Restore complete'); setView('home');
  }catch(err){ alert('Restore failed: invalid backup, or the PIN does not match this vault.'); }
  e.target.value=''; };
  r.readAsText(f);
});

function openModal(title,bodyHtml,onSave,opts){
  const o=opts||{}; const m=document.getElementById('modal');
  m.className='modal'+(o.wide?' wide':'');
  m.innerHTML=`<header><h3>${title}</h3><button class="x" id="modal-x">×</button></header>
    <div class="body">${bodyHtml}</div>
    <footer>${o.extraButtons||''}
      <button class="btn ghost" id="modal-cancel">${o.hideSave?'Close':'Cancel'}</button>
      ${o.hideSave?'':`<button class="btn" id="modal-save">${esc(o.saveLabel||'💾 Save')}</button>`}</footer>`;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow='hidden';
  document.getElementById('modal-x').onclick=closeModal;
  document.getElementById('modal-cancel').onclick=closeModal;
  const sv=document.getElementById('modal-save'); if(sv) sv.onclick=onSave||closeModal;
}

/* ================= BOOT ================= */
async function init(){
  if(!window.crypto||!crypto.subtle){
    document.getElementById('pin-err').textContent='This browser does not support encryption. Use a modern browser.';
    return;
  }
  try{ vaultLocal=JSON.parse(store.get(DB_KEY)); }catch(e){ vaultLocal=null; }
  await loadFirebase();
  if(firebaseOk){ vaultRemote=await fetchRemote(); subscribeRemote(handleRemote); }
  try{
    const sess=JSON.parse(sstore.get(AUTH_KEY)||'null');
    const bundle=(vaultLocal&&vaultLocal.salt)?vaultLocal:(vaultRemote&&vaultRemote.vault);
    if(sess&&bundle&&sess.salt===bundle.salt){
      const key=await crypto.subtle.importKey('raw',b64ToBuf(sess.key),'AES-GCM',false,['encrypt','decrypt']);
      state=mergeData(await decryptVault(bundle,key));
      currentKey=key; currentSalt=bundle.salt;
      _lastLocalAt=Number(vaultLocal&&vaultLocal.updatedAt)||0;
      showApp(); checkRemoteAfterUnlock(); return;
    }
  }catch(e){ sstore.remove(AUTH_KEY); }
  showPin();
}
